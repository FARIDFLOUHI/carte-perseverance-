<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couverture des signaux par dimension du décrochage</title>
<style>
  :root { color-scheme: light; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --line:#d9d8d3;
    --oui:#2a78d6; --non:#eb6834; --autre:#9cc3f0; --nr:#e4e3dd; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--surface); color:var(--ink);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { padding:10px 12px 14px; }
  .top { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin-bottom:10px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .sw { width:12px; height:12px; border-radius:2px; border:1px solid rgba(0,0,0,.25); flex:none; }
  .ctl { margin-left:auto; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
  select { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); }
  .terr { padding:8px 0 6px; border-top:1px solid var(--line); }
  .th { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; font-weight:600; }
  .th small { color:var(--ink-2); font-weight:400; }
  .line { display:grid; grid-template-columns:minmax(110px,190px) 1fr minmax(80px,130px); gap:10px; align-items:center; padding:2px 0; }
  .nm { color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { display:flex; height:18px; border-radius:3px; overflow:hidden; background:var(--nr); border:1px solid rgba(0,0,0,.18); }
  .seg { display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; overflow:hidden; white-space:nowrap; }
  .seg.oui { background:var(--oui); color:#fff; position:relative; overflow:visible; z-index:2; }
  .lb { white-space:nowrap; }
  .lb.out { position:absolute; left:100%; margin-left:4px; top:50%; transform:translateY(-50%); color:#0b0b0b; background:rgba(255,255,255,.88); padding:0 3px; border-radius:3px; }
  .seg.non { background:var(--non); color:#0b0b0b; }
  .seg.autre { background:var(--autre); color:#0b0b0b; }
  .seg.nr { background:var(--nr); color:#3d3c39; }
  .rep { text-align:right; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .colhead { display:grid; grid-template-columns:minmax(110px,190px) 1fr minmax(80px,130px); gap:10px; color:var(--ink-2);
    font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .msg { padding:14px; color:var(--ink-2); }
  .foot { margin-top:8px; color:var(--ink-2); font-size:12px; }
  @media (max-width:560px) { .line, .colhead { grid-template-columns:90px 1fr 0; } .rep, .colhead span:last-child { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="legend" aria-label="Légende">
      <span><i class="sw" style="background:var(--oui)"></i>Signaux repérés et action visant la dimension</span>
      <span><i class="sw" style="background:var(--non)"></i>Signaux repérés, sans action déclarée sur la dimension</span>
      <span><i class="sw" style="background:var(--autre)"></i>Action visant la dimension, sans signal déclaré</span>
      <span><i class="sw" style="background:var(--nr)"></i>Ni signal ni action sur la dimension</span>
    </div>
    <label class="ctl">Trier par
      <select id="sort">
        <option value="dept">Département, puis type</option>
        <option value="alpha">Type / territoire, puis département</option>
        <option value="comp">Part « signaux et action » comportementale</option>
        <option value="aff">Part « signaux et action » affective</option>
        <option value="cog">Part « signaux et action » cognitive</option>
      </select>
    </label>
  </div>
  <div id="msg" class="msg" hidden></div>
  <div id="rows"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function () {
  'use strict';
  var IND = [
    { k: 'comp', label: 'Dimension comportementale' },
    { k: 'aff',  label: 'Dimension affective' },
    { k: 'cog',  label: 'Dimension cognitive' }
  ];
  var SEGS = [['oui', 'Signaux repérés et action visant la dimension'], ['non', 'Signaux repérés, sans action déclarée sur la dimension'], ['autre', 'Action visant la dimension, sans signal déclaré'], ['nr', 'Ni signal ni action sur la dimension']];
  var rows = [], hasCount = false, hasDept = false;
  var el = function (t, c, txt) { var n = document.createElement(t); if (c) n.className = c; if (txt !== undefined) n.textContent = txt; return n; };
  function num(v) { var n = parseFloat(String(v === null || v === undefined ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; }
  function fmt(x) { return (Math.round(x * 10) / 10).toString().replace('.', ','); }

  function normalize(raw) {
    var out = [];
    raw.forEach(function (r) {
      var o = { label: String(r.label === null || r.label === undefined ? '' : r.label).trim() || '(sans nom)',
        dept: hasDept && r.dept ? String(r.dept).trim() : '', count: hasCount ? num(r.count) : null, ind: {} };
      var any = false;
      IND.forEach(function (i) {
        var v = {}, tot = 0;
        SEGS.forEach(function (s) { var x = num(r[i.k + '_' + s[0]]); v[s[0]] = x === null ? 0 : x; tot += v[s[0]]; });
        if (tot > 0) { any = true; SEGS.forEach(function (s) { v[s[0]] = 100 * v[s[0]] / tot; }); }
        o.ind[i.k] = tot > 0 ? v : null;
      });
      if (any) out.push(o);
    });
    return out;
  }

  function sorted() {
    var k = document.getElementById('sort').value, a = rows.slice();
    a.sort(function (x, y) {
      if (k === 'dept') return (x.dept || '').localeCompare(y.dept || '', 'fr') || x.label.localeCompare(y.label, 'fr');
      if (k !== 'alpha') {
        var xv = x.ind[k] ? x.ind[k].oui : -1, yv = y.ind[k] ? y.ind[k].oui : -1;
        if (yv !== xv) return yv - xv;
      }
      return (x.label + x.dept).localeCompare(y.label + y.dept, 'fr');
    });
    return a;
  }

  function seg(cls, pct, tip) {
    var s = el('div', 'seg ' + cls);
    if (pct >= (cls === 'oui' ? 0.5 : 3)) s.appendChild(el('span', 'lb', fmt(pct) + ' %'));
    s.style.width = pct + '%'; s.title = tip; s.setAttribute('aria-label', tip); return s;
  }

  // Étiquette dans le segment si elle y tient ; sinon, pour « Oui » (bleu), juste à droite du segment ; sinon masquée.
  function fit() {
    var lbs = document.querySelectorAll('.seg > .lb');
    Array.prototype.forEach.call(lbs, function (sp) {
      var sg = sp.parentNode;
      sp.classList.remove('out'); sp.style.visibility = '';
      if (sp.offsetWidth + 6 <= sg.clientWidth) return;
      if (sg.classList.contains('oui')) sp.classList.add('out'); else sp.style.visibility = 'hidden';
    });
  }
  window.addEventListener('resize', fit);

  function render() {
    var box = document.getElementById('rows'); box.textContent = '';
    var msg = document.getElementById('msg');
    if (!rows.length) { msg.hidden = false; msg.textContent = 'Aucune donnée à afficher pour le moment.'; return; }
    msg.hidden = true;
    var counts = {}; rows.forEach(function (r) { counts[r.label] = (counts[r.label] || 0) + 1; });
    var ch = el('div', 'colhead'); ch.appendChild(el('span', '', 'Indicateur'));
    ch.appendChild(el('span', '', 'Part des EPLE publics ayant déclaré une action (100 % = ces EPLE)'));
    ch.appendChild(el('span', '', 'Couverture des signaux'));
    box.appendChild(ch);
    sorted().forEach(function (r) {
      var t = el('div', 'terr');
      var th = el('div', 'th');
      var name = r.label + (r.dept ? ' (' + r.dept + ')' : '');
      th.appendChild(el('span', '', name));
      if (r.count) th.appendChild(el('small', '', r.count + ' EPLE avec action'));
      t.appendChild(th);
      IND.forEach(function (i) {
        var v = r.ind[i.k];
        var line = el('div', 'line');
        line.appendChild(el('div', 'nm', i.label)); line.lastChild.title = i.label;
        var bar = el('div', 'bar'), rep = el('div', 'rep', '–');
        if (v) {
          SEGS.forEach(function (s) {
            var tip = i.label + ' – ' + s[1] + ' : ' + fmt(v[s[0]]) + ' %';
            if (r.count) tip += ' (environ ' + Math.round(r.count * v[s[0]] / 100) + ' EPLE sur ' + r.count + ')';
            bar.appendChild(seg(s[0], v[s[0]], tip));
          });
          var rp = v.oui + v.non;
          if (rp > 0) rep.textContent = fmt(100 * v.oui / rp) + ' %';
        }
        line.appendChild(bar); line.appendChild(rep); t.appendChild(line);
      });
      box.appendChild(t);
    });
    document.getElementById('foot').textContent =
      'Population : EPLE publics ayant déclaré au moins une action ciblée. Couverture = parmi les EPLE ayant repéré des signaux d’une dimension, part de ceux qui déclarent au moins une action visant cette dimension. Données déclaratives. ' +
      rows.length + ' territoire' + (rows.length > 1 ? 's' : '') + ' affiché' + (rows.length > 1 ? 's' : '') + '.';
    fit();
  }
  document.getElementById('sort').addEventListener('change', render);

  var demo = /[?&]demo/.test(location.search) || window.parent === window;
  function loadGristApi(ok, fail) {
    var o = [];
    function add(x) { if (x && /^https:\/\//.test(x) && o.indexOf(x) < 0) o.push(x); }
    try { if (location.ancestorOrigins && location.ancestorOrigins.length) add(location.ancestorOrigins[0]); } catch (e) {}
    try { if (document.referrer) add(new URL(document.referrer).origin); } catch (e) {}
    add('https://docs.getgrist.com');
    try { if (location.ancestorOrigins && /^http:\/\/localhost/.test(location.ancestorOrigins[0] || '')) o.unshift(location.ancestorOrigins[0]); } catch (e) {}
    (function next(i) {
      if (i >= o.length) { fail(); return; }
      var sc = document.createElement('script'); sc.src = o[i] + '/grist-plugin-api.js';
      sc.onload = function () { if (window.grist && typeof window.grist.onRecords === 'function') ok(); else next(i + 1); };
      sc.onerror = function () { next(i + 1); };
      document.head.appendChild(sc);
    })(0);
  }
  function start() {
    var cols = [
      { name: 'label', title: 'Territoire (BEF ou Département)', type: 'Any' },
      { name: 'count', title: 'Nombre d’EPLE avec action (Nb_avec_action)', type: 'Any', optional: true },
      { name: 'dept',  title: 'Département (pour distinguer les BEF)', type: 'Any', optional: true }
    ];
    [['comp', 'Comportementale', 'Comp'], ['aff', 'Affective', 'Aff'], ['cog', 'Cognitive', 'Cog']].forEach(function (g) {
      [['oui', 'signaux ET action'], ['non', 'signaux SANS action'], ['autre', 'action SANS signal'], ['nr', 'ni signal ni action']].forEach(function (s) {
        cols.push({ name: g[0] + '_' + s[0], title: g[1] + ' – ' + s[1] + ' (' + g[2] + '_' + (s[0] === 'nr' ? 'nr' : s[0]) + ')', type: 'Any' });
      });
    });
    grist.ready({ requiredAccess: 'read table', columns: cols });
    grist.onRecords(function (recs, mappings) {
      var need = ['label']; IND.forEach(function (i) { SEGS.forEach(function (s) { need.push(i.k + '_' + s[0]); }); });
      if (!mappings || need.some(function (n) { return !mappings[n]; })) {
        var m = document.getElementById('msg'); m.hidden = false;
        m.textContent = 'Associez les colonnes dans le panneau de droite (13 champs obligatoires).'; return;
      }
      hasCount = !!mappings.count; hasDept = !!mappings.dept;
      rows = normalize(grist.mapColumnNames(recs) || []); render();
    });
  }
  if (!demo) {
    var m0 = document.getElementById('msg'); m0.hidden = false; m0.textContent = 'Chargement…';
    loadGristApi(start, function () { m0.textContent = 'Impossible de charger l’API Grist.'; });
  } else {
    hasCount = hasDept = true;
    var d = [['Calvados','',31,[52,10,6,32],[45,13,10,32],[35,10,13,42]],['Eure','',24,[58,8,4,30],[38,12,8,42],[42,17,8,33]],
             ['Manche','',18,[44,17,6,33],[50,6,11,33],[28,22,6,44]],['Seine-Maritime','',57,[60,9,5,26],[49,14,7,30],[40,19,9,32]]];
    rows = normalize(d.map(function (x) {
      var o = { label: x[0], dept: x[1], count: x[2] };
      [['comp', x[3]], ['aff', x[4]], ['cog', x[5]]].forEach(function (g) {
        o[g[0] + '_oui'] = g[1][0]; o[g[0] + '_non'] = g[1][1]; o[g[0] + '_autre'] = g[1][2]; o[g[0] + '_nr'] = g[1][3];
      });
      return o;
    }));
    render();
  }
})();
</script>
</body>
</html>
